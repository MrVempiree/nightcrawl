<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">nightcrawl</title>
  <desc id="desc">Recon checklist planner for authorized security testing, by Vempire.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0205"/>
      <stop offset="0.55" stop-color="#070304"/>
      <stop offset="1" stop-color="#1a040a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#e11d3c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e11d3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#fff5f0"/>
      <stop offset="0.55" stop-color="#e8b4ac"/>
      <stop offset="1" stop-color="#b06a63"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f0f26"/>
      <stop offset="0.55" stop-color="#e11d3c"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <path id="bat" d="M50 18 C42 6 28 2 14 8 C20 12 20 16 16 22 C24 20 30 24 34 30 C38 24 44 22 50 26 C56 22 62 24 66 30 C70 24 76 20 84 22 C80 16 80 12 86 8 C72 2 58 6 50 18 Z"/>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- moon -->
  <circle cx="1005" cy="95" r="52" fill="url(#moonGrad)"/>
  <circle cx="1005" cy="95" r="78" fill="#ff5a3c" opacity="0.12"/>

  <!-- bats -->
  <g fill="#050102">
    <use href="#bat" transform="translate(845 55) scale(1.9) rotate(-6 50 20)"/>
    <use href="#bat" transform="translate(965 150) scale(1.1) rotate(5 50 20)" opacity="0.85"/>
    <use href="#bat" transform="translate(80 40) scale(0.85) rotate(3 50 20)" opacity="0.7"/>
    <use href="#bat" transform="translate(1060 235) scale(0.7) rotate(-4 50 20)" opacity="0.6"/>
  </g>

  <!-- checklist glyph -->
  <g transform="translate(95 120)">
    <rect x="0" y="0" width="150" height="170" rx="16" fill="#ffffff" opacity="0.05" stroke="#e11d3c" stroke-opacity="0.45"/>
    <rect x="22" y="26" width="18" height="18" rx="4" fill="none" stroke="#e11d3c" stroke-width="3"/>
    <path d="M25 35 l4 4 l8 -9" fill="none" stroke="#ff5a3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="32" width="72" height="7" rx="3.5" fill="#f5ecec" opacity="0.75"/>
    <rect x="22" y="64" width="18" height="18" rx="4" fill="none" stroke="#e11d3c" stroke-width="3"/>
    <path d="M25 73 l4 4 l8 -9" fill="none" stroke="#ff5a3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="70" width="58" height="7" rx="3.5" fill="#f5ecec" opacity="0.55"/>
    <rect x="22" y="102" width="18" height="18" rx="4" fill="none" stroke="#c9a9ad" stroke-width="3"/>
    <rect x="52" y="108" width="66" height="7" rx="3.5" fill="#f5ecec" opacity="0.4"/>
    <rect x="22" y="138" width="102" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
    <rect x="22" y="138" width="68" height="8" rx="4" fill="url(#accent)"/>
  </g>

  <!-- wordmark -->
  <text x="285" y="205" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#f5ecec">night<tspan fill="#e11d3c">crawl</tspan></text>
  <rect x="290" y="232" width="180" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="290" y="272" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="26" fill="#c9a9ad">Plan the hunt before you fly.</text>
  <text x="290" y="306" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="19" fill="#9c7a7f">Recon checklist planner for authorized security testing</text>
  <text x="290" y="340" font-family="'Segoe UI', system-ui, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#ff8f9d">VEMPIRE</text>
</svg>
